version: "3.8"
services:
  mockiapi:
    image: edufsantos/mockiapi:0.1.9
    ports:
      - "3001:3001"
    restart: unless-stopped
    # Where the endpoints and their responses are saved. Without it they go away with the container.
    volumes:
      - mockiapi-data:/app/uploads

volumes:
  mockiapi-data:
