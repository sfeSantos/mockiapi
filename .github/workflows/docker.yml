name: Docker

# Builds the image for a pull request that touches it, to prove it still builds.
# Builds and pushes it for a version tag, or by hand for a tag that already exists.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build the image from, for example v0.1.9"
        required: true
        type: string
      latest:
        description: "Also move the latest tag to this image"
        type: boolean
        default: true

env:
  IMAGE: edufsantos/mockiapi

jobs:
  plan:
    name: Work out what to build
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.plan.outputs.push }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: Work out what to build
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          MOVE_LATEST: ${{ inputs.latest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a version tag such as v0.1.9."
            exit 1
          fi

          tags="$IMAGE:${tag#v}"

          # A tag push always moves latest. A run by hand may be for an older version.
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$MOVE_LATEST" = "true" ]; then
            tags="$tags,$IMAGE:latest"
          fi

          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.ref }}

      - name: Compare the tag with Cargo.toml
        if: steps.plan.outputs.push == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          version=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)

          if [ "$version" != "$VERSION" ]; then
            echo "::error::The tag says $VERSION but Cargo.toml says $version."
            exit 1
          fi

  # One build per platform, each on a runner of that architecture: compiling Rust under
  # emulation takes several times longer. When publishing, each build is pushed by digest
  # with no tag, and the manifest job below gathers them under the tags.
  image:
    name: Build the image for ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # A pull request only proves the image builds. Nothing leaves the runner.
          outputs: ${{ needs.plan.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Write down the digest
        if: needs.plan.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          echo "$DIGEST" > "digests/${{ matrix.arch }}"

      - name: Keep the digest
        if: needs.plan.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the image for both platforms
    needs: [plan, image]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One tag then answers with the image of the platform that pulls it.
      - name: Gather the platforms under the tags
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag_arguments=""

          for tag in $(echo "$TAGS" | tr ',' ' '); do
            tag_arguments="$tag_arguments --tag $tag"
          done

          sources=""

          for digest in digests/*; do
            sources="$sources $IMAGE@$(cat "$digest")"
          done

          docker buildx imagetools create $tag_arguments $sources
          docker buildx imagetools inspect "$IMAGE:$VERSION"
