name: Docker

# Builds the image for a pull request that touches it, to prove it still builds.
# Builds and pushes it for a version tag, or by hand for a tag that already exists.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build the image from, for example v0.1.9"
        required: true
        type: string
      latest:
        description: "Also move the latest tag to this image"
        type: boolean
        default: true

env:
  IMAGE: edufsantos/mockiapi

jobs:
  image:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Work out what to build
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          MOVE_LATEST: ${{ inputs.latest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:pull-request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a version tag such as v0.1.9."
            exit 1
          fi

          tags="$IMAGE:${tag#v}"

          # A tag push always moves latest. A run by hand may be for an older version.
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$MOVE_LATEST" = "true" ]; then
            tags="$tags,$IMAGE:latest"
          fi

          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.ref }}

      - name: Compare the tag with Cargo.toml
        if: steps.plan.outputs.push == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          version=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)

          if [ "$version" != "$VERSION" ]; then
            echo "::error::The tag says $VERSION but Cargo.toml says $version."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.plan.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
