name: Rust

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The dashboard is embedded in the binary, so it has to exist before cargo runs.
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      # Catches a crate that no longer packages, long before a tag tries to publish it.
      # frontend/dist is built, not committed, which cargo reports as uncommitted changes.
      - name: Check that the crate packages
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --allow-dirty

  # Everything below runs only for a version tag. A push to main publishes nothing.

  release-check:
    name: Check the tag against the crate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compare the tag with Cargo.toml
        run: |
          version=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $version. Bump the version, or tag v$version."
            exit 1
          fi

  # Named after the tag, with notes GitHub writes from the pull requests merged since the
  # previous release. Left alone when it already exists, so a rerun does not fail here.
  release:
    name: Create the GitHub release
    needs: [build, release-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  publish:
    name: Publish for ${{ matrix.os }}
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: mockiapi
            asset_name: mockiapi-linux-amd64
          - os: windows-latest
            artifact_name: mockiapi.exe
            asset_name: mockiapi-windows-amd64
          - os: macos-latest
            artifact_name: mockiapi
            asset_name: mockiapi-macos-amd64

    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The dashboard is embedded in the binary, so it has to exist before cargo runs.
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build Rust backend
        run: cargo build --release
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  # Last on purpose: a version on crates.io cannot be replaced, so it only goes out once
  # the binaries are attached to the release.
  crate:
    name: Publish to crates.io
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The crate carries frontend/dist, so it has to be built before packaging.
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
