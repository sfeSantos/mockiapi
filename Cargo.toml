[package]
name = "mockiapi"
version = "0.1.9"
edition = "2024"
authors = ["Eduardo Santos"]
repository = "https://github.com/sfeSantos/mockiapi"
homepage = "https://sfesantos.github.io/mockiapi/"
description = "A mock HTTP server in a single binary, with a web dashboard. Register REST, GraphQL and gRPC endpoints while it runs, or load them from a file or a Postman collection."
license = "MIT OR Apache-2.0"
keywords = ["mock", "api", "rest", "graphql", "grpc"]
categories = ["development-tools::testing", "web-programming::http-server"]
# frontend/dist is not in git, so it has to be listed for the published crate to carry it.
include = ["/src", "/build.rs", "/frontend/dist", "/README.md", "/LICENSE", "/LICENSE-APACHE"]

[dependencies]
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
uuid = { version = "1.16.0", features = ["v4"] }
warp = "0.3.7"
bytes = "1.10.1"
log = "0.4.26"
base64 = "0.22.1"
urlencoding = "2.1.3"
env_logger = "0.11.7"
chrono = "0.4.40"
form_urlencoded = "1.2.1"
graphql-parser = "0.4.1"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde_norway = "0.9"
